# CardioFusion – CI/CD Pipeline
# ════════════════════════════════════════════════════════════════════
# Jobs
# ────
# 1. lint-and-test   : Python (ruff + pytest) · Node (eslint)
# 2. build-images    : Build and push Docker images to GHCR
# 3. integration     : Spin up docker-compose, run smoke tests
# 4. deploy          : (optional) deploy on push to main
#
# Required GitHub Secrets
# ───────────────────────
#   GHCR_TOKEN   – GitHub Container Registry PAT (packages:write)
#
# ════════════════════════════════════════════════════════════════════

name: CardioFusion CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/cardiofusion

jobs:

  # ── Job 1: Lint & Unit Tests ──────────────────────────────────────────────
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python dev dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -r backend-ai/requirements.txt

      - name: Lint Python (ruff)
        run: ruff check backend-ai/ ml-training/

      - name: Run Python unit tests
        run: pytest tests/python/ -v --tb=short
        continue-on-error: true   # tests dir may not exist in skeleton

      # ── Node.js ─────────────────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend-gateway/package.json

      - name: Install gateway dependencies
        working-directory: backend-gateway
        run: npm install

      - name: Lint Node (eslint)
        working-directory: backend-gateway
        run: npx eslint server.js --max-warnings=0
        continue-on-error: true

      # ── React ────────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build React app (validates compilation)
        working-directory: frontend
        run: npm run build
        env:
          CI: false   # don't treat warnings as errors in demo build


  # ── Job 2: Build & Push Docker Images ────────────────────────────────────
  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: backend-ai
            image-suffix: ai
          - service: backend-gateway
            image-suffix: gateway
          - service: frontend
            image-suffix: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image-suffix }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max


  # ── Job 3: Integration Smoke Test ────────────────────────────────────────
  integration:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate synthetic artefacts for CI
        run: |
          cd ml-training
          pip install -q tensorflow scikit-learn numpy
          python train.py
          mkdir -p ../backend-ai/artefacts
          cp artefacts/* ../backend-ai/artefacts/

      - name: Build services via docker-compose
        run: |
          cp .env.example .env
          docker compose build --parallel

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for backend-ai health..."
          timeout 120 bash -c 'until docker compose exec -T backend-ai python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")" 2>/dev/null; do sleep 5; done'
          echo "Waiting for gateway health..."
          timeout 60 bash -c 'until curl -sf http://localhost:3001/health; do sleep 3; done'

      - name: Smoke test – AI /health
        run: |
          STATUS=$(docker compose exec -T backend-ai \
            python -c "import urllib.request,json; r=urllib.request.urlopen('http://localhost:8000/health'); print(json.load(r)['status'])")
          [ "$STATUS" = "ok" ] && echo "AI health OK" || exit 1

      - name: Smoke test – Gateway /health
        run: |
          curl -sf http://localhost:3001/health | grep '"status":"ok"'

      - name: Smoke test – End-to-end /analyse
        run: |
          PAYLOAD='{"ecg_waveform":'"$(python3 -c "import json,math; print(json.dumps([round(math.sin(i/50),4) for i in range(1000)]))")"',"ehr":{"age":65,"sex":1,"height":172,"weight":85,"ejection_fraction":35,"serum_creatinine":1.6,"sodium":134,"bp_systolic":105,"bp_diastolic":70,"smoking_status":1,"bmi":28.7}}'
          RESP=$(curl -sf -X POST http://localhost:3001/analyse \
            -H "Content-Type: application/json" -d "$PAYLOAD")
          echo "$RESP" | grep -q '"risk_score"' && echo "E2E test PASSED" || exit 1

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
